name: verify-639
on:
  push:
    branches: [verify-639]
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install build deps + linkers
        run: |
          sudo apt-get update
          sudo apt-get install -y autoconf automake libtool pkg-config clang lld cmake ninja-build binutils || true
          sudo apt-get install -y binutils-gold 2>/dev/null || echo "(gold unavailable)"

      - name: Build patchelf (FIXED = PR #652, this branch)
        run: |
          ./bootstrap.sh && ./configure && make -j"$(nproc)"
          cp src/patchelf /tmp/patchelf-fixed
          /tmp/patchelf-fixed --version

      - name: Build patchelf (CONTROL = 21f21b3, parent of the fix)
        run: |
          git worktree add /tmp/ctrl 21f21b3
          cd /tmp/ctrl && ./bootstrap.sh && ./configure && make -j"$(nproc)"
          cp src/patchelf /tmp/patchelf-control
          /tmp/patchelf-control --version

      - name: Build the real shim across linkers (mrbind-pybind11 @ b747f677)
        run: |
          git clone https://github.com/MeshInspector/mrbind-pybind11 /tmp/mp
          cd /tmp/mp && git checkout b747f677ab30ec62aca834c78383cd92c90e6b32
          build() { # $1=tag  $2=extra link flags
            local tag="$1" flags="$2" dir="/tmp/mp/b-$1"
            echo "=== configuring $tag (flags: $flags) ==="
            cmake -G Ninja -S source/non_limited_api -B "$dir" \
              -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_COMPILER=clang++ \
              -DCMAKE_SHARED_LINKER_FLAGS="$flags" -DCMAKE_EXE_LINKER_FLAGS="$flags" \
              -DPYBIND11_NONLIMITEDAPI_SUFFIX=meshlib \
              -DPYBIND11_NONLIMITEDAPI_PYTHON_MIN_VERSION_HEX=0x030800f0 \
              && cmake --build "$dir" -j"$(nproc)" \
              && cp "$dir/libpybind11nonlimitedapi_meshlib_3.12.so" "/tmp/shim-$tag.so" \
              && echo "  -> /tmp/shim-$tag.so" \
              || echo "  !! $tag build failed"
          }
          build lld      "-fuse-ld=lld"
          build bfd      "-fuse-ld=bfd"
          build gold     "-fuse-ld=gold"
          build lldnoro  "-fuse-ld=lld -Wl,--no-rosegment"
          # stub for dlopen dependency resolution
          cp /tmp/mp/b-lld/libpybind11nonlimitedapi_stubs.so /tmp/ 2>/dev/null || \
            cp /tmp/mp/b-bfd/libpybind11nonlimitedapi_stubs.so /tmp/ 2>/dev/null || true
          ls -la /tmp/shim-*.so 2>/dev/null || true

      - name: Verify #639 on the real shim(s), fixed vs control
        run: |
          PYLIB=$(python3 -c 'import sysconfig;print(sysconfig.get_config_var("LIBDIR"))')
          bash verify/verify.sh /tmp/patchelf-fixed /tmp/patchelf-control "/tmp:$PYLIB" /tmp/shim-*.so
