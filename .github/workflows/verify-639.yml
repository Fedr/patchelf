name: verify-639
on:
  push:
    branches: [verify-639]
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y autoconf automake libtool pkg-config xz-utils

      - name: Build patchelf (FIXED = PR #652, this branch)
        run: |
          ./bootstrap.sh && ./configure && make -j"$(nproc)"
          cp src/patchelf /tmp/patchelf-fixed
          /tmp/patchelf-fixed --version

      - name: Build patchelf 0.18.0 (RELEASED — the version linuxdeploy used in May)
        run: |
          git clone -q --depth 1 --branch 0.18.0 https://github.com/NixOS/patchelf /tmp/v018
          cd /tmp/v018 && ./bootstrap.sh && ./configure && make -j"$(nproc)"
          cp src/patchelf /tmp/patchelf-018
          /tmp/patchelf-018 --version

      - name: Verify #639 on the real MeshLib shim (0.18.0 vs PR #652)
        run: bash verify/verify.sh /tmp/patchelf-fixed /tmp/patchelf-018 verify/fixture/libpybind11nonlimitedapi_meshlib_3.12.so.xz
